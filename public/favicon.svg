  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="492" height="492" x="10" y="10" rx="118" fill="none" stroke="#E50914" stroke-width="4" opacity="0.3"/>
  <path d="M 160 120 L 320 120 C 370 120, 400 150, 400 190 C 400 230, 360 250, 330 256 C 375 265, 410 290, 410 340 C 410 390, 370 420, 310 420 L 160 420 Z" fill="none" stroke="url(#redGrad)" stroke-width="36" stroke-linejoin="round" filter="url(#glow)"/>
