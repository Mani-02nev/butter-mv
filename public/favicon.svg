<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="butterflyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27"/>
      <stop offset="50%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#99000D"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Badge -->
  <rect width="100" height="100" rx="28" fill="#0A0A0F"/>
  <rect width="98" height="98" x="1" y="1" rx="27" fill="none" stroke="url(#butterflyGrad)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Left Upper Wing -->
  <path d="M 50 48 Q 20 15 15 35 Q 12 55 46 54 Z" fill="url(#butterflyGrad)" filter="url(#glow)"/>
  <!-- Left Lower Wing -->
  <path d="M 48 55 Q 22 58 20 72 Q 28 85 47 64 Z" fill="url(#butterflyGrad)" opacity="0.85"/>

  <!-- Right Upper Wing -->
  <path d="M 50 48 Q 80 15 85 35 Q 88 55 54 54 Z" fill="url(#butterflyGrad)" filter="url(#glow)"/>
  <!-- Right Lower Wing -->
  <path d="M 52 55 Q 78 58 80 72 Q 72 85 53 64 Z" fill="url(#butterflyGrad)" opacity="0.85"/>

  <!-- Butterfly Center Body -->
  <path d="M 50 32 L 50 70" stroke="url(#goldGlow)" stroke-width="4" stroke-linecap="round"/>
  <!-- Antennae -->
  <path d="M 50 32 Q 44 22 38 20" stroke="url(#goldGlow)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 50 32 Q 56 22 62 20" stroke="url(#goldGlow)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="38" cy="20" r="2" fill="#FFD700"/>
  <circle cx="62" cy="20" r="2" fill="#FFD700"/>
  
  <!-- Center Play Gem -->
  <polygon points="48,46 56,50 48,54" fill="#FFFFFF"/>
</svg>