<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0306" />
      <stop offset="40%" stop-color="#14050a" />
      <stop offset="80%" stop-color="#040916" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="80%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="spiderRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="100%" stop-color="#E50914" />
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050505" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#050505" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="bottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050505" stop-opacity="0" />
      <stop offset="100%" stop-color="#050505" stop-opacity="1" />
    </linearGradient>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)" />
  <circle cx="960" cy="450" r="600" fill="url(#redGlow)" />
  <circle cx="1400" cy="350" r="500" fill="url(#blueGlow)" />

  <!-- Spider Web Lines -->
  <g opacity="0.15" stroke="#FF1E27" stroke-width="1">
    <line x1="960" y1="400" x2="0" y2="0" />
    <line x1="960" y1="400" x2="1920" y2="0" />
    <line x1="960" y1="400" x2="1920" y2="1080" />
    <line x1="960" y1="400" x2="0" y2="1080" />
    <line x1="960" y1="400" x2="960" y2="0" />
    <line x1="960" y1="400" x2="960" y2="1080" />
    <line x1="960" y1="400" x2="0" y2="400" />
    <line x1="960" y1="400" x2="1920" y2="400" />
    <circle cx="960" cy="400" r="120" fill="none" />
    <circle cx="960" cy="400" r="260" fill="none" />
    <circle cx="960" cy="400" r="420" fill="none" />
    <circle cx="960" cy="400" r="600" fill="none" />
  </g>

  <!-- Large Spider Symbol Emblem -->
  <g transform="translate(1250, 420)" filter="url(#glowFilter)" opacity="0.8">
    <polygon points="0,-120 20,-40 60,-80 30,0 90,-20 40,40 100,100 20,70 0,140 -20,70 -100,100 -40,40 -90,-20 -30,0 -60,-80 -20,-40" fill="url(#spiderRed)" />
  </g>

  <!-- Overlays -->
  <rect width="1920" height="1080" fill="url(#overlay)" />
  <rect width="1920" height="1080" fill="url(#bottomFade)" />
</svg>